name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test-scan:
    name: Build · Test · Coverage · Vulnerability Scan
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Set up Java 8 ───────────────────────────────────────────────────
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      # ── 3. Build ───────────────────────────────────────────────────────────
      - name: Build
        run: mvn --batch-mode clean compile -f Java8app/pom.xml

      # ── 4. Unit tests + JaCoCo coverage report ────────────────────────────
      - name: Run tests
        run: mvn --batch-mode test -f Java8app/pom.xml

      # ── 5. Enforce 80% coverage gate (jacoco:check) ───────────────────────
      - name: Enforce 80% coverage threshold
        run: mvn --batch-mode jacoco:check -f Java8app/pom.xml

      # ── 6. Upload JaCoCo HTML report as artefact ──────────────────────────
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Java8app/target/site/jacoco/
          retention-days: 14

      # ── 7. Trivy vulnerability scan (open-source, no API key needed) ───────
      #    Scans the filesystem for HIGH and CRITICAL CVEs in dependencies.
      #    Fails the build if any are found.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: Java8app
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # ── 8. Upload Trivy SARIF report as artefact ──────────────────────────
      - name: Trivy scan — upload SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: Java8app
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 14

      # ── 9. Package WAR (only after all gates pass) ────────────────────────
      - name: Package WAR
        run: mvn --batch-mode package -DskipTests -f Java8app/pom.xml

      # ── 10. Upload WAR artefact ───────────────────────────────────────────
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: simple-pharmacy-war
          path: Java8app/target/simple-pharmacy.war
          retention-days: 14
